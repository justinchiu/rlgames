[project]
name = "rlgames"
version = "0.1.0"
description = "Small two-player zero-sum games in JAX for studying RL training dynamics"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jax>=0.11.2",
    "numpy>=2.5.4",
    "optax>=0.2.8",
    "pyrallis>=0.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
